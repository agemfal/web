<!-- Demo Local: backend simulado del módulo de usuarios y equipos -->

<script src="app.js"></script>
<script>
/* PERFIL — cuenta, rol, equipos, administración y configuración */
const enlace = (href, ic, titulo, detalle) => `<li class="info"><a class="enlace" href="${href}">
  <span class="ic">${icono(ic)}</span><span class="cuerpo"><b>${esc(titulo)}</b><small>${esc(detalle)}</small></span>
  <span class="lado">${icono("flecha")}</span></a></li>`;
const demo = () => CONFIG.MODO_DATOS === "local" && typeof SimuladorRBAC !== "undefined";
let yo = null, demoAbierto = false;   // GET /me (incluye mi horario de avisos)
/* ===== Notificaciones: estado REAL (navegador + servidor), no lo que quedó anotado ===== */
let notif = null;   // { modo, permiso, suscripto, servidor, instalada }
async function cargarNotif(){
  const n = { modo:CONFIG.MODO_DATOS, permiso: "Notification" in window ? Notification.permission : "no_soportado",
              soportado: App.pushSoportado(), suscripto:false, servidor:null, configurado:true, instalada:App.instalada(), ios:App.esIOSsinInstalar() };
  if (n.modo !== "local" && n.soportado) {
    let sub = null;
    try { sub = await App.pushSuscripcion(); n.suscripto = !!sub; } catch {}
    const r = await App.api("GET", "/push/estado" + (sub ? "?endpoint=" + encodeURIComponent(sub.endpoint) : ""));
    if (r.cuerpo?.ok) { n.servidor = r.cuerpo.data.dispositivos; n.este = r.cuerpo.data.este; }
    else if (r.cuerpo?.error?.codigo === "PUSH_DESHABILITADO") n.configurado = false;
  }
  // Activos de verdad = permiso dado + suscripción en ESTE navegador + el servidor tiene ESA suscripción
  n.push = n.permiso === "granted" && n.suscripto && n.este === true;
  try { localStorage.setItem("pushActivo", n.push ? "1" : "0"); } catch {}
  notif = n; App.redibujar();
}
function estadoPush(){
  const n = notif;
  if (!n) return ["info", "…", "Revisando el estado"];
  if (n.modo === "local") return ["info", "Demo", "En la demo no hay servidor: funciona en la página real"];
  if (!n.soportado) return ["warn", "No admite", n.ios ? "En iPhone: instalá la app (Compartir → Agregar a inicio) y abrila desde el ícono" : "Probá con Chrome"];
  if (!n.configurado) return ["warn", "Sin configurar", "El servidor no tiene configurados los avisos: avisale al Administrador"];
  if (n.permiso === "denied") return ["crit", "Bloqueados", "El navegador los bloqueó: Configuración del sitio → Notificaciones → Permitir"];
  if (n.push) return ["ok", "Activos", `Activos en este dispositivo · ${n.servidor} dispositivo${n.servidor === 1 ? "" : "s"} en total · tocá para desactivarlos`];
  if (n.suscripto || n.servidor > 0) return ["warn", "Incompletos", "Faltan en este dispositivo: tocá para activarlos de nuevo"];
  return ["info", "Apagados", "Escalamientos, convocatorias, menciones y mensajes de tus chats · tocá para activarlos"];
}
// Desactivar un aviso pide DOS confirmaciones (para no apagarlo sin querer en medio de un turno)
async function confirmarDoble(que, consecuencia){
  const a = await App.formulario({ titulo:`¿Desactivar ${que}?`, enviar:"Continuar", campos:[{ tipo:"nota", texto:consecuencia }] });
  if (!a) return false;
  const b = await App.formulario({ titulo:"Confirmá que querés desactivarlo", enviar:"Sí, desactivar", peligro:true,
    campos:[{ tipo:"nota", texto:`Vas a dejar de recibir: ${que}. Lo podés volver a activar desde acá cuando quieras.` }] });
  return !!b;
}
function ayudaSonido(){
  App.ventana({ titulo:"Si el aviso no suena", subtitulo:"Se configura en el celular, no en la página", copiar:false, texto:[
    "Android:",
    "1. Ajustes → Aplicaciones → Assurance Center (o Chrome) → Notificaciones.",
    "2. Activá «Permitir sonido y vibración» o elegí «Alerta» (no «Silencioso»).",
    "3. Entrá a la categoría (General / agemfal.github.io), elegí un sonido e importancia «Alta» o «Urgente».",
    "4. Revisá que el celular no esté en «No molestar» y que el volumen de notificaciones no esté en cero.",
    "",
    "iPhone:",
    "1. Instalá la app (Compartir → Agregar a inicio) y abrila desde el ícono.",
    "2. Ajustes → Notificaciones → Assurance Center → Permitir notificaciones y Sonidos.",
    "3. Revisá que no esté activo un modo de Concentración."
  ].join("\n") });
}

async function cargarYo(){ const r = await App.api("GET", "/me"); if (r.cuerpo?.ok) { yo = r.cuerpo.data; App.redibujar(); } }

// Horario armado "laboral": L–V 8:00–20:00
const laboral = d => { const f = d?.horario?.franjas; return f?.length === 1 && f[0].dias.join() === "1,2,3,4,5" && f[0].desde === "08:00" && f[0].hasta === "20:00"; };
// Mi horario de avisos: cuándo me pueden molestar las escalaciones. La matriz del equipo no lo pisa.
async function editarHorario(){
  const d = yo?.usuario?.disponibilidad, f0 = d?.horario?.franjas?.[0];
  const DIAS = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado", "Domingo"];
  const f = await App.formulario({ titulo:"Mi horario de avisos", campos:[
    { tipo:"nota", texto:"Las escalaciones solo te suenan (app, correo, Telegram, llamada) dentro de este horario. Fuera de él igual te quedan en la campana, en silencio, y el escalamiento sigue con el próximo nivel. Ninguna matriz de equipo puede cambiar esto: lo decidís vos." },
    { id:"modalidad", etiqueta:"¿Cuándo te pueden avisar?", tipo:"select", valor: !d ? "siempre" : laboral(d) ? "laboral" : "franjas",
      opciones:[{ valor:"siempre", texto:"Siempre (24 × 7)" }, { valor:"laboral", texto:"Horario laboral (lunes a viernes, 8 a 20)" }, { valor:"franjas", texto:"Personalizado: elijo días y horas" }] },
    { id:"dias", etiqueta:"Días (solo si elegiste Personalizado)", tipo:"multi", valor:(f0?.dias || [1, 2, 3, 4, 5]).map(String), opciones:DIAS.map((t, i) => ({ valor:String(i + 1), texto:t })) },
    { id:"desde", etiqueta:"Desde", tipo:"time", valor:f0?.desde || "08:00" },
    { id:"hasta", etiqueta:"Hasta", tipo:"time", valor:f0?.hasta || "20:00" },
    { id:"criticos", etiqueta:"Excepción", tipo:"multi", valor: d?.criticos_siempre ? ["si"] : [], opciones:[{ valor:"si", texto:`Avisarme igual si el INC es crítico (${clasif().categorias.filter(c => sevInc(c.p) === "crit").map(c => c.nombre).join(", ")})` }] } ] });
  if (!f) return;
  const body = f.modalidad === "siempre" ? { modalidad:"siempre" }
    : f.modalidad === "laboral" ? { modalidad:"franjas", criticos_siempre:f.criticos.includes("si"), franjas:[{ dias:[1, 2, 3, 4, 5], desde:"08:00", hasta:"20:00" }] }
    : { modalidad:"franjas", criticos_siempre:f.criticos.includes("si"), franjas:[{ dias:f.dias.map(Number), desde:f.desde, hasta:f.hasta }] };
  if (body.modalidad === "franjas" && !f.dias.length) return App.aviso("Elegí al menos un día");
  if (await App.enviar("PUT", "/me/disponibilidad", body, "Horario de avisos guardado")) cargarYo();
}

// Mi teléfono para el canal Llamada (escalamientos). Vacío = no me llaman.
async function editarTelefono(){
  const f = await App.formulario({ titulo:"Mi teléfono para llamadas", campos:[
    { tipo:"nota", texto:"Si un escalamiento te avisa por Llamada, te llaman a este número y te leen el INC. Presionando 1 lo tomás. La llamada respeta tu horario de avisos. Dejalo vacío si no querés que te llamen." },
    { id:"telefono", etiqueta:"Teléfono con código de país", tipo:"tel", valor:yo?.usuario?.telefono || "", ayuda:"+54 9 11 5555-0101" } ] });
  if (!f) return;
  if (await App.enviar("PUT", "/me/telefono", { telefono:f.telefono }, f.telefono ? "Teléfono guardado" : "Teléfono quitado: no te van a llamar")) cargarYo();
}

/* ===== Mi secuencia de avisos: los pasos de la matriz (fijos) + los que sumo yo =====
   Los minutos se cuentan desde que arranca cada nivel. Mis pasos se suman a los de la matriz y nunca los sacan;
   si un canal está en los dos, vale el minuto más temprano. Lo que mi perfil no recibe, o la llamada sin teléfono, no se manda. */
const CANAL_TXT = { app:"App", email:"Correo", telegram:"Telegram", llamada:"Llamada" };
const MAX_PASOS = 5;
const txtPaso = p => `${CANAL_TXT[p.canal] || p.canal} ${p.min ? "a los " + p.min + " min" : "enseguida"}`;
const canalesPerfil = () => yo?.notificaciones_perfil?.find(t => t.id === "escalamiento")?.canales || [];
function chipPaso(p){
  const fijo = p.origen === "matriz";
  const estilo = p.permitido ? "" : ' style="opacity:.55;text-decoration:line-through"';
  return `<span class="chip ${p.permitido ? (fijo ? "info" : "ok") : "warn"}"${estilo} title="${esc(p.permitido ? (fijo ? "De la matriz: no se puede sacar" : "Paso tuyo") : p.motivo || "")}">
    ${fijo ? icono("candado") : '<span class="punto"></span>'}${esc(txtPaso(p))}</span>`;
}
function tarjetaSecuencia(){
  if (!yo) return C.tarjeta({ titulo:"Mi secuencia de avisos", iconoTit:"subir", cuerpo:C.vacio("Cargando…", "reloj") });
  const propios = yo.usuario.pasos || [], secs = yo.secuencias || [];
  const llamada = propios.some(p => p.canal === "llamada") || secs.some(s => s.niveles.some(n => n.pasos.some(p => p.canal === "llamada")));
  const faltaTel = llamada && !yo.usuario.telefono && canalesPerfil().includes("llamada");
  const matrices = secs.length ? `<ul class="lista">${secs.flatMap(s => s.niveles.map(n => `<li class="info"><span class="ic">${icono("red")}</span>
      <span class="cuerpo"><b>${esc(s.equipo.nombre)} · nivel ${esc(n.nivel)}</b><small>El nivel siguiente arranca a los ${esc(n.espera_min)} min</small>
      <span class="toggles" style="margin-top:6px">${n.pasos.map(chipPaso).join("")}</span></span></li>`)).join("")}</ul>`
    : `<p class="cambio" style="margin:0 0 10px">Hoy no figurás en ninguna matriz de escalamiento: tus pasos se van a sumar cuando te agreguen.</p>`;
  const mios = `<ul class="lista">${propios.map((p, i) => `<li class="ok"><span class="ic">${icono("campana")}</span>
      <span class="cuerpo"><b>${esc(txtPaso(p))}</b><small>${canalesPerfil().includes(p.canal) ? "Se suma en cada nivel donde figurás" : "Tu perfil no recibe este canal: no se manda"}</small></span>
      <button class="boton chico peligro" data-accion="paso-quitar:${i}" aria-label="Quitar ${esc(txtPaso(p))}">${icono("x")}</button></li>`).join("")}
    ${propios.length < MAX_PASOS ? `<li class="info clic" data-accion="paso-agregar"><span class="ic">${icono("mas")}</span><span class="cuerpo"><b>Agregar un paso mío</b>
      <small>Por ejemplo, un correo a los 5 minutos</small></span><span class="lado">${icono("flecha")}</span></li>` : ""}</ul>`;
  return C.tarjeta({ titulo:"Mi secuencia de avisos", iconoTit:"subir", cuerpo:`
    <p class="cambio" style="margin:0 0 10px">Si nadie toca <b>Tomar</b>, el escalamiento te avisa en este orden. Los minutos se cuentan desde que arranca cada nivel.
      ${icono("candado")} = lo pone la matriz del equipo y no se puede sacar. Tus pasos se suman y respetan tu horario de avisos.</p>
    ${faltaTel ? `<p class="cambio" style="margin:0 0 10px;color:var(--warn)">${icono("alerta")} Tenés Llamada en tu secuencia pero no cargaste tu teléfono:
      <a href="#" data-accion="telefono">cargalo acá</a> o no te van a llamar.</p>` : ""}
    <div class="sub grupo-cfg">En las matrices de tus equipos</div>${matrices}
    <div class="sub grupo-cfg">Mis pasos (los agrego yo)</div>${mios}` });
}
async function guardarPasos(pasos, ok){
  const r = await App.enviar("PUT", "/me/pasos", { pasos }, ok);
  if (r) { (r.advertencias || []).slice(0, 2).forEach(a => App.aviso("Atención: " + a, 7000)); cargarYo(); }
}
async function agregarPaso(){
  const propios = yo?.usuario?.pasos || [];
  const libres = ["app", "email", "telegram", "llamada"].filter(c => !propios.some(p => p.canal === c));
  if (!libres.length) return App.aviso("Ya tenés un paso por cada canal");
  const f = await App.formulario({ titulo:"Agregar un paso a mi secuencia", enviar:"Agregar", campos:[
    { tipo:"nota", texto:"Se suma a lo que dice la matriz de cada equipo donde figurás (no lo reemplaza). Los minutos se cuentan desde que arranca el nivel; 0 = enseguida." },
    { id:"canal", etiqueta:"Canal", tipo:"select", valor:libres[0], opciones:libres.map(c => ({ valor:c, texto:(CANAL_TXT[c] || c) + (canalesPerfil().includes(c) ? "" : " (tu perfil no lo recibe)") })) },
    { id:"min", etiqueta:"A los (minutos, de 0 a 1440)", tipo:"number", valor:"5", requerido:true } ] });
  if (!f) return;
  const min = Number(f.min);
  if (!Number.isInteger(min) || min < 0 || min > 1440) return App.aviso("Los minutos van de 0 a 1440", 3500);
  await guardarPasos([...propios, { canal:f.canal, min }], "Paso agregado a tu secuencia");
}
async function quitarPaso(i){
  const propios = yo?.usuario?.pasos || [], p = propios[i];
  if (!p) return;
  if (!await confirmarDoble(`el paso «${txtPaso(p)}»`, "Ese aviso deja de llegarte en los escalamientos. Los pasos que pone la matriz del equipo siguen igual.")) return;
  await guardarPasos(propios.filter((_, k) => k !== i), "Paso quitado de tu secuencia");
}

async function cambiarClave(){
  const f = await App.formulario({ titulo:"Cambiar mi clave", enviar:"Cambiar clave", campos:[
    { tipo:"nota", texto:"Mínimo 12 caracteres, con mayúscula, minúscula y número, y sin tu usuario. Se cierran tus otras sesiones abiertas." },
    { id:"actual", etiqueta:"Clave actual", tipo:"password", requerido:true },
    { id:"nueva", etiqueta:"Clave nueva", tipo:"password", requerido:true },
    { id:"repetir", etiqueta:"Repetir clave nueva", tipo:"password", requerido:true } ] });
  if (!f) return;
  if (f.nueva !== f.repetir) return App.aviso("Las claves nuevas no coinciden", 3500);
  await App.enviar("POST", "/me/clave", { actual:f.actual, nueva:f.nueva }, "Clave cambiada");
}

App.iniciar({
  id: "perfil",
  titulo: "Perfil",
  render: () => {
    const me = App.me;
    const equipos = me ? me.equipos : (() => { try { return JSON.parse(sessionStorage.getItem("equipos") || "[]"); } catch { return []; } })();
    // Configuración agrupada por tema (cada uno ve solo lo que su perfil permite)
    const grupos = [
      ["Personas", [
        App.puede("ver_usuarios") || App.puede("solicitar_alta_usuario") ? enlace("usuarios.html", "usuario", "Usuarios", "Altas, roles, equipos y estado") : "",
        App.puede("ver_equipos") ? enlace("equipos.html", "red", "Equipos", "Responsable, integrantes, horario, servicios y matriz") : "" ]],
      ["Operación", [
        App.rol === "ADMIN" ? enlace("catalogo-servicios.html", "server", "Servicios", "Servicios de cada red (Fija, Móvil…): agregar, editar o sacar") : "",
        App.rol === "ADMIN" ? enlace("clasificacion-inc.html", "filtro", "Clasificación y SLA", "Prioridades, incidente mayor, categorías y SLA") : "",
        App.puede("editar_matriz") ? enlace("matrices.html", "subir", "Matrices de escalamiento", "Orden de aviso por equipo, o el mismo para varios o todos") : "" ]],
      ["Avisos", [ App.rol === "ADMIN" ? enlace("notificaciones-perfil.html", "campana", "Notificaciones por perfil", "Qué avisos recibe cada rol y por qué canales") : "" ]],
      ["Control", [ App.puede("ver_auditoria") ? enlace("auditoria.html", "check", "Auditoría", "Quién hizo qué, cuándo y en qué equipo") : "" ]]
    ].map(([t, xs]) => [t, xs.filter(Boolean)]).filter(([, xs]) => xs.length);
    const actual = sessionStorage.getItem("usuarioDemo") || USUARIO_DEMO_POR_ROL[App.rol];
    const usuariosDemo = demo() ? SimuladorRBAC.estado().usuarios.filter(u => u.estado === "activo") : [];
    const falta = CONFIG.MODO_DATOS === "local" && typeof SimuladorRBAC === "undefined";
    return `
      ${falta ? C.tarjeta({ clase:"crit", cuerpo: C.vacio("No se cargó el módulo de usuarios del demo: copiá rbac-demo.js en la misma carpeta que app.js y recargá con Ctrl+F5.", "alerta") }) : ""}
      ${C.tarjeta({ titulo:"Mi cuenta", iconoTit:"usuario", cuerpo: C.lista([
        C.item({ estado:"info", icono:"usuario", titulo: App.usuario, detalle: ROLES_TXT[App.rol] || App.rol }),
        `<li class="info clic" data-accion="telefono"><span class="ic">${icono("telefono")}</span><span class="cuerpo"><b>Mi teléfono para llamadas</b>
          <small>${esc(!yo ? "…" : yo.usuario.telefono || "Sin cargar: los escalamientos no te pueden llamar")} · tocá para cambiarlo</small></span><span class="lado">${icono("flecha")}</span></li>`,
        // "Mi clave" solo para cuentas con clave propia (emergencia). Quien entra con código no tiene clave.
        !yo || yo.usuario.origen_clave !== "local" ? ""
          : `<li class="info clic" data-accion="clave"><span class="ic">${icono("candado")}</span><span class="cuerpo"><b>Mi clave</b>
          <small>Clave propia de Assurance Center · tocá para cambiarla</small></span><span class="lado">${icono("flecha")}</span></li>`,
        ...equipos.map(e => C.item({ estado: e.es_responsable ? "ok" : "info", icono:"red", titulo:e.nombre, detalle: e.es_responsable ? "Responsable del equipo" : "Integrante" }))
      ]) })}
      ${C.tarjeta({ titulo:"Notificaciones", iconoTit:"campana", cuerpo: (() => {
        const [est, txt, det] = estadoPush(), on = (b, si, no) => C.chip(b ? "ok" : "info", b ? si : no);
        const fila = (accion, ic, tit, detalle, chip) => `<li class="info clic" data-accion="${accion}"><span class="ic">${icono(ic)}</span><span class="cuerpo"><b>${tit}</b>
          <small>${detalle}</small></span>${chip || `<span class="lado">${icono("flecha")}</span>`}</li>`;
        return `<div class="sub grupo-cfg">Con la pantalla apagada o en otra app</div><ul class="lista">
          ${fila("push-sw", "telefono", "Avisos del celular", esc(det || "Escalamientos, convocatorias, menciones y mensajes de tus chats"), C.chip(est, txt))}
          ${notif && notif.modo !== "local" ? fila("push-probar", "campana", "Probar los avisos", notif.push ? "Te manda una notificación de prueba a este dispositivo" : "Primero hay que activar los avisos en este dispositivo: tocá y te los activo") : ""}
          ${App.instalada() ? "" : fila("instalar", "subir", "Instalar la app", "Ícono en el celular y pantalla completa (en iPhone hace falta para los avisos)")}
          ${fila("ayuda-sonido", "info", "Si el aviso no suena", "Cómo activar sonido y vibración en Android y iPhone")}</ul>
          <div class="sub grupo-cfg">Con la página abierta</div><ul class="lista">
          ${fila("alarma-sw", "alerta", "Alarma de escalamientos", "Escalamientos y SLA vencidos: suena y vibra hasta que actuás", on(App.alarmaOn(), "Activa", "Apagada"))}
          ${fila("alarma-probar", "campana", "Probar la alarma", "Mirá y escuchá cómo te va a avisar · subí el volumen")}
          ${fila("chat-sonido", "mensaje", "Mensajes de los chats", "Un «tin» suave y un aviso arriba, sin interrumpir", on(App.chatSonidoOn(), "Activo", "Apagado"))}</ul>
          <div class="sub grupo-cfg">Cuándo y qué</div><ul class="lista">
          ${fila("horario", "reloj", "Mi horario de avisos", esc((yo ? yo.usuario.disponibilidad_txt : "…") + " · tocá para cambiarlo"))}
          ${App.rol === "ADMIN" ? "" : `<li class="info"><a class="enlace" href="notificaciones-perfil.html"><span class="ic">${icono("info")}</span><span class="cuerpo"><b>Qué te llega por tu perfil</b>
          <small>${esc(yo ? yo.notificaciones_perfil.filter(t => t.canales.length).length + " de " + yo.notificaciones_perfil.length + " tipos de aviso" : "…")}</small></span><span class="lado">${icono("flecha")}</span></a></li>`}</ul>`;
      })() })}
      ${tarjetaSecuencia()}
      ${grupos.length ? C.tarjeta({ titulo:"Configuración", iconoTit:"filtro", cuerpo: grupos.map(([t, xs]) =>
        `<div class="sub grupo-cfg">${esc(t)}</div><ul class="lista">${xs.join("")}</ul>`).join("") }) : ""}
      ${demo() ? `<details class="demo" id="modoDemo" ${demoAbierto ? "open" : ""}><summary>Modo demo · usuario demo, n8n, velocidad y datos</summary>
        <div class="sub">Usuario demo</div>
        <p class="cambio" style="margin:0 0 8px">Probá el sistema con otro rol. Clave de todos: demo123.</p>
        <ul class="lista">${usuariosDemo.map(u => `<li class="${u.username === actual ? "ok" : "info"} clic" data-accion="demo:${esc(u.username)}">
          <span class="ic">${icono("usuario")}</span>
          <span class="cuerpo"><b>${esc(u.nombre)}</b><small>${esc(ROLES_TXT[u.rol] || u.rol)} · ${esc(u.username)}</small></span>
          ${u.username === actual ? C.chip("ok", "En uso") : ""}</li>`).join("")}</ul>
        <div class="sub">Conexión con n8n (solo demo)</div>
        <p class="cambio" style="margin:0 0 8px">Los cambios de categoría de un INC se mandan también a este webhook, para que n8n actualice el INC en la base de datos.</p>
        <div class="fila-cfg" style="grid-template-columns:1fr auto auto"><input id="fN8n" type="url" placeholder="https://tu-n8n/webhook/inc-categoria" value="${esc(App.webhookN8n() || "")}">
          <button class="boton chico" data-accion="n8n-guardar">Guardar</button><button class="boton chico" data-accion="n8n-probar">Probar</button></div>
        <div class="sub">Velocidad del escalamiento (solo demo)</div>
        <div class="filtros">${[[1, "Real (1 min = 1 min)"], [60, "Rápida (1 min = 1 s)"]].map(([v, t]) =>
          `<button data-accion="demo-vel:${v}" class="${SimuladorRBAC.velocidad() === v ? "activo" : ""}">${t}</button>`).join("")}</div>
        <div class="btns"><button class="boton chico peligro" data-accion="demo-reiniciar">Reiniciar datos demo</button></div></details>` : ""}
      ${C.tarjeta({ titulo:"Información de la app", iconoTit:"info", cuerpo: C.lista([
        C.item({ estado:"info", icono:"reloj",  titulo:"Actualización automática", detalle:"Cada " + CONFIG.REFRESCO_SEG + " segundos" }),
        C.item({ estado:"info", icono:"alerta", titulo:"Criterio de estado (por INC)", detalle:clasif().categorias.map(c => `P${c.p} ${c.nombre}`).join(" · ") }),
        C.item({ estado:"info", icono:"server", titulo:"Origen de datos", detalle: CONFIG.MODO_DATOS === "local" ? "Local (pruebas)" : "Servidor" })
      ]) })}
      <button class="boton peligro" data-accion="salir">${icono("salir")} Cerrar sesión</button>`;
  },
  alMontar: () => {
    if (!yo) cargarYo();
    if (!notif) cargarNotif();
    const d = document.getElementById("modoDemo"); if (d) d.ontoggle = () => { demoAbierto = d.open; };
  },
  accion: id => {
    if (id === "horario") { editarHorario(); return true; }
    if (id === "telefono") { editarTelefono(); return true; }
    if (id === "paso-agregar") { agregarPaso(); return true; }
    if (id.startsWith("paso-quitar:")) { quitarPaso(Number(id.slice(12))); return true; }
    if (id === "alarma-sw") {
      (async () => {
        if (App.alarmaOn() && !await confirmarDoble("la alarma de escalamientos", "Si llega un escalamiento o vence un SLA, no va a sonar ni vibrar con la página abierta. Solo vas a ver el aviso en la campana.")) return;
        App.alarmaConfigurar(!App.alarmaOn()); App.aviso(App.alarmaOn() ? "Alarma activada" : "Alarma desactivada", 2500); App.redibujar();
      })();
      return true;
    }
    if (id === "ayuda-sonido") { ayudaSonido(); return true; }
    if (id === "instalar") { App.instalarApp(); return true; }
    if (id === "push-sw") {
      (async () => {
        if (notif?.push) {
          if (!await confirmarDoble("los avisos del celular", "Con la pantalla apagada o la página cerrada no te va a llegar ningún escalamiento, convocatoria ni mensaje.")) return;
          await App.pushDesactivar();
        } else if (notif?.permiso === "denied") {
          return App.aviso("El navegador los tiene bloqueados: Configuración del sitio → Notificaciones → Permitir, y volvé a tocar acá", 8000);
        } else await App.pushActivar();
        await cargarNotif();
      })();
      return true;
    }
    if (id === "push-probar") {
      (async () => {
        if (!notif?.push) {
          if (notif?.permiso === "denied") return App.aviso("El navegador bloqueó las notificaciones: Configuración del sitio → Notificaciones → Permitir", 8000);
          if ((await App.pushActivar()) !== true) return;
          await cargarNotif();
          if (!notif?.push) return;
        }
        App.pushProbar();
      })();
      return true;
    }
    if (id === "chat-sonido") {
      (async () => {
        if (App.chatSonidoOn() && !await confirmarDoble("el aviso de mensajes de los chats", "Cuando te escriban en un chat no vas a escuchar el «tin» ni ver el aviso arriba; solo el número en el ícono de Chats.")) return;
        App.chatSonidoConfigurar(!App.chatSonidoOn()); if (App.chatSonidoOn()) { App.sonarChat(); App.avisoChat({ titulo:"INC000000000 · Prueba", texto:"Así te va a avisar un mensaje nuevo", href:"chats.html" }); } App.redibujar();
      })();
      return true;
    }
    if (id === "alarma-probar") { App.alarma({ id:"prueba", tipo:"escalamiento", titulo:"Prueba de alarma", cuerpo:"Así vas a ver y escuchar un escalamiento. Tocá Silenciar para cerrarla.", puede_tomar:false }, { prueba:true }); return true; }
    if (id === "clave") { cambiarClave(); return true; }
    if (id === "n8n-guardar" || id === "n8n-probar") {
      const url = document.getElementById("fN8n").value.trim();
      try { url ? localStorage.setItem("n8nWebhookInc", url) : localStorage.removeItem("n8nWebhookInc"); } catch {}
      if (id === "n8n-guardar") { App.aviso(url ? "Webhook de n8n guardado" : "Conexión con n8n desactivada"); return true; }
      if (!url) { App.aviso("Cargá la URL del webhook"); return true; }
      App.avisarN8n("INC-PRUEBA", 6, { p:1, nombre:"Crítico Mayor", prioridad:"critica", grave:"si" }, { motivo:"Prueba de conexión" }, null, true)
        .then(ok => ok && App.aviso("n8n respondió bien", 3000));
      return true;
    }
    if (id.startsWith("demo-vel:")) { SimuladorRBAC.velocidad(Number(id.slice(9))); App.aviso("Velocidad del escalamiento actualizada"); App.redibujar(); return true; }
    if (id.startsWith("demo:")) {
      sessionStorage.setItem("usuarioDemo", id.slice(5));
      sessionStorage.removeItem("tokenRBAC");
      App.sincronizarSesion().then(d => d ? location.reload() : App.aviso("No se pudo ingresar con ese usuario"));
      return true;
    }
    if (id === "demo-reiniciar") {
      SimuladorRBAC.reiniciar();
      ["tokenRBAC", "usuarioDemo"].forEach(k => sessionStorage.removeItem(k));
      App.aviso("Datos demo reiniciados");
      App.sincronizarSesion().then(() => location.reload());
      return true;
    }
  }
});
</script>
</body>
</html>
