<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icono-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ingresar · Assurance Center</title>
<script src="ux.js?v=04084cdf57"></script>
<link rel="stylesheet" href="estilos.css?v=84ca19bcc9">
<style>
  .login{min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:24px 16px}
  .login .card{width:100%; max-width:380px; margin:0}
  .login .marca{display:flex; align-items:center; gap:10px; margin:0 0 18px}
  .login .marca .ic{width:44px; height:44px; border-radius:12px; display:grid; place-items:center; background:var(--boton); color:var(--sobre-boton)}
  .login .marca .ic svg{width:22px; height:22px}
  .login .marca .marca-nombre{font-size:var(--t-xl); font-weight:700; letter-spacing:-.015em; line-height:1.2; margin:0}
  .login .marca small{color:var(--suave); font-size:var(--t-sm)}
  .login .marca .ic svg{fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
  .login .campo > label span{font-size:var(--t-sm); color:var(--suave); font-weight:500}
  .login .fila-clave{display:flex; gap:8px}
  .login .fila-clave input{flex:1; min-width:0}
  .login .ver{width:auto; flex:none; min-height:var(--objetivo); min-width:var(--objetivo); padding:0 12px; font-size:var(--t-sm)}
  .login .nota a{color:var(--acento); text-decoration:underline}
  .login .error{min-height:20px; margin:0 0 10px; color:var(--crit); font-size:14px}
  .login .boton.primario{width:100%; min-height:44px; justify-content:center}
  .login .nota{color:var(--suave); font-size:var(--t-sm); margin:14px 0 0; line-height:1.5}
  .login .reglas{margin:0 0 12px; padding-left:0; list-style:none; color:var(--suave); font-size:12px; line-height:1.6}
  .login .reglas li.ok{color:var(--ok)}
</style>
</head>
<body>
<main class="login"><section class="card" id="caja" aria-live="polite"></section></main>
<script src="rbac-demo.js?v=3368b5abc8"></script>
<script src="app.js?v=bbff451a88"></script>
<script>
/* INGRESO
   · Con código (lo normal): usuario → POST /auth/codigo → llega un código de 6 dígitos al correo de la empresa
     (lo manda el n8n de la empresa; el NOC no conoce el correo) → POST /auth/login { usuario, clave:<código> }.
   · Con clave (cuentas de emergencia y la demo): POST /auth/login { usuario, clave }. Si es temporal, pide cambiarla (POST /me/clave). */
const ss = sessionStorage, params = new URLSearchParams(location.search);
// Service worker también en el ingreso: Chrome lo necesita para ofrecer "Instalar app" (y para los avisos push)
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
const DESTINO = "escritorio.html";
const local = CONFIG.MODO_DATOS === "local";
let estado = params.get("cambio") === "1" && ss.getItem("token") ? "cambio" : "ingreso";
let modo = local ? "clave" : "codigo";            // "codigo" | "clave"
let claveIngresada = "", ocupado = false, aviso = "", esperaHasta = 0, reloj = null;

async function pedir(metodo, ruta, body, token){
  if (local) return SimuladorRBAC.atender({ metodo, ruta:"/api" + ruta, token, body });
  try {
    const res = await fetch(CONFIG.URL_API + ruta, { method:metodo,
      headers:{ "Content-Type":"application/json", ...(token ? { Authorization:"Bearer " + token } : {}) }, body:JSON.stringify(body || {}) });
    return { http:res.status, cuerpo: await res.json() };
  } catch {
    return { http:0, cuerpo:{ ok:false, error:{ codigo:"SIN_CONEXION", mensaje:"No se pudo contactar al servidor. Revisá la conexión o la VPN." } } };
  }
}

function guardarSesion(d){
  ["tokenRBAC", "usuarioDemo", "nombreLogin", "loginDemo", "permisos", "equipos", "avisoSesion", "expira"].forEach(k => ss.removeItem(k));
  ss.setItem("token", d.token);
  ss.setItem("usuario", d.usuario.username);
  ss.setItem("nombre", d.usuario.nombre);
  ss.setItem("rol", d.usuario.rol);
  ss.setItem("origenClave", d.origen_clave);
  if (d.expira_en) ss.setItem("expira", d.expira_en);        // para avisar 10 minutos antes de que venza
  if (local) { ss.setItem("tokenRBAC", d.token); ss.setItem("loginDemo", d.token); }   // la demo usa la sesión recién creada
}

const marca = sub => `<div class="marca"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true">${ICONOS.candado}</svg></span><span><h1 class="marca-nombre">Assurance Center</h1><small>${esc(sub)}</small></span></div>`;
const campoClave = (id, etiqueta, auto) => `<div class="campo"><label for="${id}"><span>${etiqueta}</span></label>
  <div class="fila-clave"><input id="${id}" type="password" autocomplete="${auto}" required>
  <button type="button" class="boton ver" data-ver="${id}" aria-controls="${id}">Mostrar</button></div></div>`;

function dibujar(error = ""){
  const caja = document.getElementById("caja");
  if (estado === "ingreso" && modo === "codigo") {
    caja.innerHTML = `${marca("Gestión de incidentes y continuidad del servicio")}
      <form id="fPedir" novalidate>
        <label class="campo"><span>Usuario</span><input id="fUsuario" autocomplete="username" autocapitalize="none" spellcheck="false" required value="${esc(ss.getItem("usuario") || "")}"></label>
        <p class="error" id="fError" role="alert">${esc(error)}</p>
        <button class="boton primario" type="submit" ${ocupado ? "disabled" : ""}>${ocupado ? "Enviando…" : "Enviarme un código"}</button>
      </form>
      <p class="nota">Te llega un código a tu correo de la empresa. No hace falta clave.</p>
      <p class="nota"><a href="#" id="fModo">Entrar con clave</a> (cuentas de emergencia)</p>`;
    document.getElementById("fUsuario").focus();
    document.getElementById("fPedir").onsubmit = ev => { ev.preventDefault(); pedirCodigo(); };
    document.getElementById("fModo").onclick = ev => { ev.preventDefault(); modo = "clave"; dibujar(); };
  } else if (estado === "codigo") {
    const falta = Math.max(0, Math.ceil((esperaHasta - Date.now()) / 1000));
    caja.innerHTML = `${marca("Revisá tu correo de la empresa")}
      <form id="fCodigo" novalidate>
        <p class="nota" style="margin:0 0 12px">${esc(aviso)}</p>
        <label class="campo"><span>Código de 6 dígitos</span><input id="fCod" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></label>
        <p class="error" id="fError" role="alert">${esc(error)}</p>
        <button class="boton primario" type="submit" ${ocupado ? "disabled" : ""}>${ocupado ? "Ingresando…" : "Ingresar"}</button>
      </form>
      <p class="nota">¿No llegó? Puede tardar hasta un minuto (revisá también Correo no deseado). Si pedís otro, el primero que llegue también sirve.
        <span id="fOtroZona"></span> <a href="#" id="fOtro">Usar otro usuario</a></p>`;
    const c = document.getElementById("fCod");
    c.oninput = () => { c.value = c.value.replace(/\D/g, "").slice(0, 6); if (c.value.length === 6 && !ocupado) ingresarCodigo(); };
    c.focus();
    document.getElementById("fCodigo").onsubmit = ev => { ev.preventDefault(); ingresarCodigo(); };
    document.getElementById("fOtro").onclick = ev => { ev.preventDefault(); clearInterval(reloj); estado = "ingreso"; dibujar(); };
    // Cuenta regresiva para pedir otro código: cambia solo ese texto (no borra lo que se está escribiendo)
    const zona = document.getElementById("fOtroZona");
    const tic = () => {
      const s = Math.max(0, Math.ceil((esperaHasta - Date.now()) / 1000));
      if (s) { zona.textContent = `Podés pedir otro en ${s} s.`; return; }
      clearInterval(reloj);
      zona.innerHTML = `<a href="#" id="fOtroCod">Pedir otro código</a>.`;
      document.getElementById("fOtroCod").onclick = ev => { ev.preventDefault(); pedirCodigo(); };
    };
    clearInterval(reloj); tic(); if (falta) reloj = setInterval(tic, 1000);
  } else if (estado === "ingreso") {
    caja.innerHTML = `${marca("Gestión de incidentes y continuidad del servicio")}
      <form id="fIngreso" novalidate>
        <label class="campo"><span>Usuario o correo</span><input id="fUsuario" autocomplete="username" autocapitalize="none" spellcheck="false" required value="${esc(ss.getItem("usuario") || "")}"></label>
        ${campoClave("fClave", "Clave", "current-password")}
        <p class="error" id="fError" role="alert">${esc(error)}</p>
        <button class="boton primario" type="submit" ${ocupado ? "disabled" : ""}>${ocupado ? "Ingresando…" : "Ingresar"}</button>
      </form>
      <p class="nota">Solo para cuentas de emergencia o que usan la clave de la empresa.
        <a href="#" id="fModo">Entrar con un código por correo</a></p>
      ${local ? `<p class="nota"><b>Demo:</b> admin, ana, bruno o carla · clave <code>demo123</code>.</p>` : ""}`;
    const u = document.getElementById("fUsuario");
    (u.value ? document.getElementById("fClave") : u).focus();
    document.getElementById("fIngreso").onsubmit = ev => { ev.preventDefault(); ingresar(); };
    document.getElementById("fModo").onclick = ev => { ev.preventDefault(); modo = "codigo"; dibujar(); };
  } else {
    caja.innerHTML = `${marca("Tenés que cambiar tu clave")}
      <form id="fCambio" novalidate>
        ${claveIngresada ? "" : campoClave("fActual", "Clave actual", "current-password")}
        ${campoClave("fNueva", "Clave nueva", "new-password")}
        <ul class="reglas" id="fReglas"></ul>
        ${campoClave("fRepetir", "Repetir clave nueva", "new-password")}
        <p class="error" id="fError" role="alert">${esc(error)}</p>
        <button class="boton primario" type="submit" ${ocupado ? "disabled" : ""}>${ocupado ? "Guardando…" : "Guardar y entrar"}</button>
      </form>
      <p class="nota">Tu clave es temporal o la reseteó el Administrador: elegí una nueva para continuar.
        <a href="#" id="fOtro">Ingresar con otro usuario</a></p>`;
    const nueva = document.getElementById("fNueva");
    nueva.oninput = reglasClave; reglasClave();
    (document.getElementById("fActual") || nueva).focus();
    document.getElementById("fCambio").onsubmit = ev => { ev.preventDefault(); cambiar(); };
    document.getElementById("fOtro").onclick = ev => { ev.preventDefault(); salir(); };
  }
  caja.querySelectorAll("[data-ver]").forEach(b => b.onclick = () => {
    const i = document.getElementById(b.dataset.ver), ver = i.type === "password";
    i.type = ver ? "text" : "password"; b.textContent = ver ? "Ocultar" : "Mostrar"; i.focus();
  });
}

// Requisitos de la clave nueva (los valida también n8n: estos son solo una ayuda)
function reglasClave(){
  const v = document.getElementById("fNueva").value, u = (ss.getItem("usuario") || "").toLowerCase();
  const reglas = [[v.length >= 12, "Al menos 12 caracteres"], [/[A-Z]/.test(v), "Una mayúscula"], [/[a-z]/.test(v), "Una minúscula"],
    [/\d/.test(v), "Un número"], [!(u.length >= 3 && v.toLowerCase().includes(u)), "Sin tu usuario"]];
  document.getElementById("fReglas").innerHTML = reglas.map(([ok, t]) => `<li class="${ok && v ? "ok" : ""}">${ok && v ? "✓ " : ""}${t}</li>`).join("");
}

async function pedirCodigo(){
  const campo = document.getElementById("fUsuario");
  const usuario = (campo ? campo.value : ss.getItem("usuario") || "").trim().toLowerCase();
  if (!usuario) return dibujar("Ingresá tu usuario");
  ss.setItem("usuario", usuario);
  ocupado = true; dibujar();
  // En la demo no hay correo: los usuarios de prueba entran con clave
  const r = local ? { cuerpo:{ ok:true, data:{ mensaje:"Demo: no se envían correos. Volvé y usá «Entrar con clave» (demo123)." } } }
                  : await pedir("POST", "/auth/codigo", { usuario });
  ocupado = false;
  if (!r.cuerpo?.ok) { estado = "ingreso"; return dibujar(r.cuerpo?.error?.mensaje || "No se pudo pedir el código"); }
  aviso = r.cuerpo.data?.mensaje || "Si el usuario existe, te llega un código a tu correo de la empresa.";
  esperaHasta = Date.now() + 60000; estado = "codigo"; dibujar();
}
async function ingresarCodigo(){
  const usuario = ss.getItem("usuario") || "", codigo = (document.getElementById("fCod")?.value || "").trim();
  if (!/^\d{6}$/.test(codigo)) return dibujar("El código tiene 6 dígitos");
  ocupado = true; dibujar();
  const r = await pedir("POST", "/auth/login", { usuario, clave:codigo });
  ocupado = false;
  if (!r.cuerpo?.ok) return dibujar(r.cuerpo?.error?.mensaje || "No se pudo ingresar");
  guardarSesion(r.cuerpo.data);
  entrar();
}
async function ingresar(){
  const usuario = document.getElementById("fUsuario").value.trim(), clave = document.getElementById("fClave").value;
  if (!usuario || !clave) return dibujar("Ingresá usuario y clave");
  modo = "clave";
  ss.setItem("usuario", usuario);
  ocupado = true; dibujar();
  const r = await pedir("POST", "/auth/login", { usuario, clave });
  ocupado = false;
  if (!r.cuerpo?.ok) return dibujar(r.cuerpo?.error?.mensaje || "No se pudo ingresar");
  guardarSesion(r.cuerpo.data);
  if (r.cuerpo.data.debe_cambiar_clave) { claveIngresada = clave; estado = "cambio"; return dibujar(); }
  entrar();
}

async function cambiar(){
  const actual = claveIngresada || document.getElementById("fActual").value;
  const nueva = document.getElementById("fNueva").value, repetir = document.getElementById("fRepetir").value;
  if (!actual || !nueva) return dibujar("Completá las claves");
  if (nueva !== repetir) return dibujar("Las claves nuevas no coinciden");
  ocupado = true; dibujar();
  const r = await pedir("POST", "/me/clave", { actual, nueva }, ss.getItem("token"));
  ocupado = false;
  if (!r.cuerpo?.ok) {
    if (r.http === 401) { estado = "ingreso"; claveIngresada = ""; return dibujar("La sesión venció: volvé a ingresar"); }
    return dibujar(r.cuerpo?.error?.mensaje || "No se pudo cambiar la clave");
  }
  claveIngresada = "";
  entrar();
}

function entrar(){ location.replace(params.get("volver") && /^[a-z-]+\.html/.test(params.get("volver")) ? params.get("volver") : DESTINO); }
async function salir(){
  const t = ss.getItem("token");
  if (t) await pedir("POST", "/auth/logout", {}, t);
  ss.clear(); estado = "ingreso"; claveIngresada = ""; modo = local ? "clave" : "codigo"; dibujar();
}

// Ya hay sesión válida → directo a la app
(async () => {
  // Venimos de una sesión que se cerró sola: se explica por qué
  const viejo = ss.getItem("tokenViejo");
  if (viejo && !local) {
    ss.removeItem("tokenViejo");
    const m = await pedir("POST", "/auth/motivo", { token:viejo });
    const motivo = m.cuerpo?.data?.motivo;
    if (motivo === "otro_dispositivo") return dibujar("Tu sesión se cerró porque entraste con tu usuario desde otro dispositivo o navegador.");
    if (motivo === "vencida") return dibujar("Tu sesión venció: por seguridad dura 3 horas. Volvé a ingresar.");
  }
  if (estado === "ingreso" && ss.getItem("token") && ss.getItem("origenClave")) {
    const r = local ? SimuladorRBAC.atender({ metodo:"GET", ruta:"/api/me", token:ss.getItem("token") })
                    : await fetch(CONFIG.URL_API + "/me", { headers:{ Authorization:"Bearer " + ss.getItem("token") } })
                        .then(async x => ({ http:x.status, cuerpo:await x.json() })).catch(() => ({ http:0 }));
    if (r.http === 200) return entrar();
    if (r.cuerpo?.error?.codigo === "CAMBIO_CLAVE_REQUERIDO") estado = "cambio";
  }
  dibujar();
})();
</script>
</body>
</html>
