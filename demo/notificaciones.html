<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icono-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Notificaciones</title>
<script src="ux.js?v=04084cdf57"></script>
<link rel="stylesheet" href="estilos.css?v=1337aeadcf">
</head>
<body>
<main id="app"></main>
<script src="rbac-demo.js?v=d78e0f89fb"></script>
<script src="app.js?v=f2b1ad4f2b"></script>
<script>
/* NOTIFICACIONES — pensada para gente ocupada, de arriba hacia abajo:
   1. Para atender: una tarjeta por INC que espera que yo actúe (Enterado / Tomar), con su nivel y SLA. Se va sola al atenderlo.
   2. Para decidir: INC cerrados que volvieron a entrar.
   3. Novedades: el resto (menciones, Enterado de otros, cierres, cambios). Los niveles y SLA sueltos quedan en "Historial". */
let datos = null, error = null, filtro = "novedades";
const TIPO = {
  mencion:      { ic:"mensaje", txt:"Mención",      clase:"crit" },
  convocatoria: { ic:"equipo",  txt:"Convocatoria", clase:"warn" },
  convocatoria_general: { ic:"alerta", txt:"Convocatoria general", clase:"crit" },
  debate:       { ic:"mensaje", txt:"Chat del INC", clase:"info" },
  escalamiento: { ic:"subir",   txt:"Escalamiento", clase:"crit" },
  sla:          { ic:"reloj",   txt:"SLA",          clase:"crit" },
  inc_cambio:   { ic:"cambiar", txt:"Cambio de categoría", clase:"warn" },
  general:      { ic:"campana", txt:"Aviso",        clase:"info" }
};

async function recargar(){
  const r = await App.api("GET", "/notificaciones?limite=100");
  error = r.cuerpo.ok ? null : r.cuerpo.error.mensaje;
  const nuevo = r.cuerpo.ok ? r.cuerpo.data : null;
  if (JSON.stringify(nuevo) === JSON.stringify(datos)) return;
  datos = nuevo; App.redibujar();
}

// Una tarjeta por INC para atender: qué equipos míos esperan, en qué nivel va y el botón para cortarlo
function tarjetaAtender(){
  const xs = datos.atender || [];
  if (!xs.length) return "";
  return C.tarjeta({ titulo:`Para atender (${xs.length})`, iconoTit:"alerta", cuerpo:`<ul class="lista">${xs.map(x => {
    const inc = esc(x.inc);
    const niveles = x.equipos.map(e => { const s = e.escalamiento || {};
      return `${esc(e.nombre || "—")}${s.estado === "esperando"
        ? (s.nivel === 0 ? ` · nivel 1 ${enCuanto(s.proximo_en)}` : ` · nivel ${s.nivel} de ${s.niveles}${s.proximo_en ? ` · nivel ${s.nivel + 1} ${enCuanto(s.proximo_en)}` : ""}`)
        : s.motivo === "agotado" ? " · escalamiento agotado" : ""}`; }).join("<br>");
    const pend = clave => App.pendientes.has(clave);
    const botones = [
      ...(x.enterado.length ? [pend(`${x.inc}:enterado`)
        ? `<button class="boton chico" data-accion="deshacer:${inc}:enterado">Enterado · Deshacer</button>`
        : `<button class="boton chico primario" data-accion="inc:enterado:${inc}:enterado">${icono("check")}Enterado</button>`] : []),
      ...x.tomar.map(t => pend(`${x.inc}:${t.id}`)
        ? `<button class="boton chico" data-accion="deshacer:${inc}:${esc(t.id)}">Tomando · Deshacer</button>`
        : `<button class="boton chico primario" data-accion="inc:tomar:${inc}:${esc(t.id)}">${icono("mano")}Tomar${x.tomar.length > 1 ? " · " + esc(t.nombre) : ""}</button>`),
      `<button class="boton chico" data-accion="abririnc:${inc}">${icono("mensaje")}Chat</button>`];
    return `<li class="crit alto"><span class="ic">${icono("subir")}</span>
      <span class="cuerpo"><b style="white-space:normal">${esc(x.titulo || x.inc)}</b>
        <small><span class="mono-inc">${inc}</span> ${C.chipInc(x.prioridad)}${C.chipSla(x.sla)}</small>
        <span class="cambio" style="color:var(--suave)">${niveles}${x.con_llamada ? " · te llamaron" : ""}</span>
        <span class="btns" style="margin-top:6px">${botones.join("")}</span></span></li>`;
  }).join("")}</ul>` });
}

function liNotificacion(n){
  const t = TIPO[n.tipo] || TIPO.general;
  return `<li class="${n.leida ? "" : t.clase} alto clic" data-accion="n:abrir:${esc(n.id)}" style="${n.leida ? "opacity:.6" : ""}">
    <span class="ic" style="${n.leida ? "background:var(--panel2);color:var(--tenue)" : ""}">${icono(n.silenciosa ? "silencio" : t.ic)}</span>
    <span class="cuerpo"><b style="white-space:normal">${esc(n.titulo)}</b>
      ${n.cuerpo ? `<span class="cambio" style="color:var(--suave)">${esc(n.cuerpo)}</span>` : ""}
      <small>${esc(t.txt)}${n.silenciosa ? " · en silencio (fuera de tu horario)" : ""}${n.con_llamada ? " · también te llamaron" : ""} · ${hace(n.fecha)}${n.equipo ? " · " + esc(n.equipo) : ""}</small>
${n.puede_tomar && filtro !== "historial" ? `<span class="btns" style="margin-top:6px">${App.pendientes.has(`${n.inc}:${n.team_id}`)
        ? `<button class="boton chico" data-accion="deshacer:${esc(n.inc)}:${esc(n.team_id)}">Tomando · Deshacer</button>`
        : `<button class="boton chico primario" data-accion="inc:tomar:${esc(n.inc)}:${esc(n.team_id)}">${icono("mano")}Tomar ${esc(n.inc)}${n.equipo ? " · " + esc(n.equipo) : ""}</button>`}</span>` : ""}</span>
    ${n.leida ? "" : `<span class="pastilla" style="background:var(--acento)">nueva</span>`}
  </li>`;
}

// INC cerrados en el NOC que volvieron a entrar abiertos por la API: se consulta si se reabren (SQL 035)
function tarjetaReingresos(){
  const rs = datos.reingresos || [];
  if (!rs.length) return "";
  return C.tarjeta({ titulo:`Para decidir (${rs.length})`, iconoTit:"alerta", cuerpo:`<ul class="lista">${rs.map(r => `
    <li class="warn alto"><span class="ic">${icono("alerta")}</span>
      <span class="cuerpo"><b style="white-space:normal">${esc(r.inc)}${r.titulo ? " · " + esc(r.titulo) : ""}</b>
        <span class="cambio" style="color:var(--suave)">Lo cerraron en el NOC${r.cerrado_en ? " " + hace(r.cerrado_en) : ""} y volvió a entrar ${r.estado_nuevo === "en_curso" ? "en curso" : "abierto"} por la API ${hace(r.detectado_en)}. ¿Se reabre?</span>
        <small>${r.prioridad ? C.chipInc(r.prioridad) : ""}${r.equipos.length ? " · " + esc(r.equipos.join(", ")) : ""}</small>
        <span class="btns" style="margin-top:6px">
          <button class="boton chico primario" data-accion="re:reabrir:${esc(r.inc)}">${icono("subir")}Reabrir</button>
          <button class="boton chico" data-accion="re:mantener_cerrado:${esc(r.inc)}">Mantener cerrado</button></span></span>
    </li>`).join("")}</ul>` });
}
async function decidir(accion, inc){
  const ok = await App.enviar("POST", `/incidentes/${encodeURIComponent(inc)}/acciones`, { accion },
    accion === "reabrir" ? `${inc} reabierto: arranca el escalamiento` : `${inc} sigue cerrado`);
  if (ok) recargar();
}

async function abrir(id){
  const n = datos.notificaciones.find(x => x.id === id);
  if (!n.leida) await App.api("POST", "/notificaciones/leer", { ids:[id] });
  if (n.enlace) location.href = n.enlace;
  else { await recargar(); App.revisarNotificaciones(); }
}

App.iniciar({
  id: "notificaciones",
  titulo: "Notificaciones",
  render: () => {
    if (error) return C.tarjeta({ cuerpo: C.vacio(error, "alerta") });
    if (!datos) return C.tarjeta({ cuerpo: C.vacio("Cargando…", "reloj") });
    // Novedades = todo menos los niveles y SLA sueltos (esos viven en su tarjeta de "Para atender"). Historial = todo, sin filtrar.
    const opciones = [["novedades", "Novedades"], ["nuevas", "Sin leer"], ["historial", "Historial"]];
    const pasa = { novedades:n => !n.agrupada, nuevas:n => !n.agrupada && !n.leida, historial:() => true };
    const vis = datos.notificaciones.filter(pasa[filtro]);
    const sinLeer = datos.notificaciones.filter(pasa.nuevas).length;
    const nada = !(datos.atender || []).length && !(datos.reingresos || []).length;
    return `
      ${tarjetaAtender()}
      ${tarjetaReingresos()}
      ${nada && filtro === "novedades" && !vis.length ? C.tarjeta({ cuerpo: C.vacio("Todo al día: no hay nada para atender", "check") }) : ""}
      <div class="filtros">${opciones.map(([id, txt]) =>
        `<button data-accion="f:${id}" class="${filtro === id ? "activo" : ""}">${txt}${id === "nuevas" && sinLeer ? ` <span class="num">${sinLeer}</span>` : ""}</button>`).join("")}</div>
      ${vis.length ? C.tarjeta({ titulo: filtro === "historial" ? "Historial completo" : "Novedades", iconoTit:"campana",
        extra: sinLeer && filtro !== "historial" ? `<button class="boton chico" style="margin-left:auto" data-accion="n:todas">${icono("check")}Marcar leídas</button>` : "",
        cuerpo:`<ul class="lista">${vis.map(liNotificacion).join("")}</ul>` })
        : filtro === "novedades" ? "" : C.tarjeta({ cuerpo: C.vacio(filtro === "nuevas" ? "No hay novedades sin leer" : "Nada por acá") })}`;
  },
  alMontar: () => { if (!datos && !error) recargar(); },
  alNotificar: () => recargar(),
  alCambiarInc: () => recargar(),
  accion: id => {
    if (id.startsWith("f:")) { filtro = id.slice(2); App.redibujar(); return true; }
    if (id === "n:todas") { App.api("POST", "/notificaciones/leer", {}).then(() => { recargar(); App.revisarNotificaciones(); }); return true; }
    if (id.startsWith("n:abrir:")) { abrir(id.slice(8)); return true; }
    if (id.startsWith("re:")) { const [, accion, inc] = id.split(":"); decidir(accion, inc); return true; }
  }
});
</script>
</body>
</html>
